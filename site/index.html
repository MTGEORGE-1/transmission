<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>China vs US — Where Are the Markets Heading</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#1c2b3a;          /* headings — deep navy, warmer than black */
    --body:#3d4f61;         /* body copy */
    --soft:#6b7f92;         /* secondary */
    --faint:#93a3b3;
    --rule:#e3e9ef;
    --panel:#f7f9fb;

    --cn:#c8342b;           /* China */
    --cn-soft:#fdf1f0;
    --us:#1f5fa9;           /* United States */
    --us-soft:#eef4fb;

    --sans:Calibri,"Segoe UI",Candara,"Avenir Next","Trebuchet MS",
           "Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--body);
    font-family:var(--sans);font-size:17px;line-height:1.65;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px 90px}
  /* The header sits in its own .wrap, whose 90px bottom padding would
     otherwise open a dead gap above the sticky nav. */
  .wrap.head{padding-bottom:0}

  h1,h2,h3{color:var(--ink);font-weight:600;letter-spacing:-.015em;margin:0}
  h1{font-size:44px;line-height:1.14}
  h2{font-size:29px;line-height:1.25}
  h3{font-size:19px}
  p{margin:0 0 16px}

  /* ---------- header ---------- */
  header{padding:70px 0 40px}
  .kicker{color:var(--cn);font-weight:600;font-size:14px;letter-spacing:.13em;
    text-transform:uppercase;margin-bottom:18px}
  .kicker span{color:var(--us)}
  .lede{font-size:20px;color:var(--soft);max-width:60ch;margin-top:20px}
  .built{margin-top:26px;font-size:14px;color:var(--faint)}

  /* ---------- nav ---------- */
  nav{position:sticky;top:0;background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);z-index:20;
    margin-bottom:44px}
  nav .inner{max-width:1080px;margin:0 auto;padding:13px 28px;
    display:flex;gap:26px;flex-wrap:wrap;font-size:15px}
  nav a{color:var(--soft);text-decoration:none;font-weight:500;white-space:nowrap}
  nav a:hover{color:var(--cn)}

  /* ---------- scoreboard ---------- */
  .board{border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:26px}
  .board-head{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.1fr;
    background:var(--panel);padding:13px 20px;font-size:13px;font-weight:600;
    letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
    border-bottom:1px solid var(--rule)}
  .board-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.1fr;
    padding:16px 20px;align-items:center;border-bottom:1px solid var(--rule);
    text-decoration:none;color:inherit}
  .board-row:last-child{border-bottom:none}
  .board-row:hover{background:var(--panel)}
  .board-row .sec{font-weight:600;color:var(--ink);font-size:17px}
  .pct{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
  .pct.cn{color:var(--cn)} .pct.us{color:var(--us)}
  .winner{display:inline-block;font-size:13px;font-weight:600;padding:4px 11px;
    border-radius:20px;letter-spacing:.02em}
  .w-cn{background:var(--cn-soft);color:var(--cn)}
  .w-us{background:var(--us-soft);color:var(--us)}
  .w-tie{background:#f0f2f4;color:var(--soft)}

  .takeaway{background:var(--panel);border-left:4px solid var(--cn);
    padding:22px 26px;border-radius:0 10px 10px 0;margin:34px 0 10px}
  .takeaway h3{margin-bottom:9px}
  .takeaway p{margin:0;color:var(--body)}

  /* ---------- sector ---------- */
  .sector{padding-top:58px;border-top:1px solid var(--rule);margin-top:58px}
  .sector-blurb{font-size:18px;color:var(--soft);max-width:64ch;margin-top:12px}

  .versus{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:30px 0 26px}
  .vcard{border-radius:11px;padding:20px 22px}
  .vcard.cn{background:var(--cn-soft)} .vcard.us{background:var(--us-soft)}
  .vcard .who{font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
  .vcard.cn .who{color:var(--cn)} .vcard.us .who{color:var(--us)}
  .vcard .big{font-size:37px;font-weight:600;line-height:1.1;margin:7px 0 2px;
    font-variant-numeric:tabular-nums}
  .vcard.cn .big{color:var(--cn)} .vcard.us .big{color:var(--us)}
  .vcard .cap{font-size:14.5px;color:var(--soft)}

  .chartbox{border:1px solid var(--rule);border-radius:12px;padding:22px;margin-bottom:26px}
  .chart{width:100%;height:auto;display:block}
  .legend{display:flex;gap:22px;margin-bottom:14px;font-size:15px;font-weight:500}
  .legend i{display:inline-block;width:22px;height:3px;border-radius:2px;
    margin-right:8px;vertical-align:4px}
  .cap-note{font-size:14.5px;color:var(--faint);margin-top:14px;line-height:1.5}

  /* stats strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;background:var(--rule);border:1px solid var(--rule);
    border-radius:11px;overflow:hidden;margin-bottom:30px}
  .stat{background:#fff;padding:15px 17px}
  .stat .k{font-size:13px;color:var(--faint);margin-bottom:5px}
  .stat .pair{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat .v.cn{color:var(--cn)} .stat .v.us{color:var(--us)}

  /* tables */
  .tables{display:grid;grid-template-columns:1fr;gap:26px}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:11px}
  .tbl-title{font-size:15px;font-weight:600;padding:14px 18px;
    border-bottom:1px solid var(--rule)}
  .tbl-title.cn{color:var(--cn);background:var(--cn-soft)}
  .tbl-title.us{color:var(--us);background:var(--us-soft)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--rule);
    white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal;min-width:170px}
  tr:last-child td{border-bottom:none}
  th{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--faint);font-weight:600;background:#fcfdfe}
  td{font-variant-numeric:tabular-nums}
  td.name{font-weight:600;color:var(--ink);font-variant-numeric:normal}
  td.pos{color:#1a7f4b} td.neg{color:#b3392e}
  .young{font-size:12px;color:var(--faint);font-weight:400;display:block;
    font-variant-numeric:normal}

  .note{background:#fffaf0;border:1px solid #f0e2c8;border-radius:10px;
    padding:16px 19px;font-size:15px;color:#7a6234;margin-bottom:26px}
  .note b{color:#5f4c26}

  ul.lim{padding-left:22px;color:var(--soft);font-size:16px}
  ul.lim li{margin-bottom:11px}

  footer{margin-top:70px;padding-top:26px;border-top:1px solid var(--rule);
    color:var(--faint);font-size:14.5px}

  @media(max-width:820px){
    h1{font-size:32px} h2{font-size:24px}
    .versus{grid-template-columns:1fr}
    .board-head{display:none}
    .board-row{grid-template-columns:1fr 1fr;gap:8px 14px}
    .board-row .sec{grid-column:1/-1}
  }
</style>
</head>
<body>

<div class="wrap head" id="top">
<header>
  <div class="kicker">China <span>vs</span> United States</div>
  <h1>Where are the markets heading?</h1>
  <p class="lede" id="lede"></p>
  <div class="built" id="built"></div>
</header>
</div>

<nav><div class="inner" id="nav"></div></nav>

<div class="wrap">
  <h2>The scoreboard</h2>
  <p style="max-width:62ch;margin-top:10px">Ten-year annualised return for an equal-weight
     basket of roughly ten leading companies on each side. This is what an investor would
     have earned, not a measure of how big the businesses are.</p>

  <div class="board" id="board"></div>
  <div id="takeaway"></div>

  <div id="sectors"></div>

  <h2 style="margin-top:70px">What this comparison cannot tell you</h2>
  <ul class="lim" id="lim"></ul>

  <footer id="footer"></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.VERSUS;
  if(!D){document.body.innerHTML =
    '<div style="padding:60px;font-family:sans-serif">Run <b>python run.py</b> first — '+
    'site/data.js is missing.</div>'; return;}

  const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const pct = v => v==null ? '—' : (v*100).toFixed(1)+'%';
  const pctS= v => v==null ? '—' : (v>0?'+':'')+(v*100).toFixed(1)+'%';
  const money = v => {
    if(v==null||!isFinite(v)) return '—';
    const a=Math.abs(v);
    if(a>=1e12) return '$'+(v/1e12).toFixed(1)+'T';
    if(a>=1e9)  return '$'+(v/1e9).toFixed(1)+'B';
    if(a>=1e6)  return '$'+(v/1e6).toFixed(0)+'M';
    return '$'+v.toFixed(0);
  };
  const num = v => v==null||!isFinite(v) ? '—' : v.toFixed(1);

  document.getElementById('lede').textContent = D.meta.subtitle;
  document.getElementById('built').textContent =
    'Built ' + D.meta.generated_at.replace('T',' ') + ' · prices and financials from Yahoo Finance';

  const order = D.meta.sector_order;

  /* ---------- nav ---------- */
  document.getElementById('nav').innerHTML =
    '<a href="#top">Scoreboard</a>' +
    order.map(k=>`<a href="#${k}">${esc(D.sectors[k].label)}</a>`).join('');

  /* ---------- scoreboard ---------- */
  let wins={cn:0,us:0};
  const rows = order.map(k=>{
    const s=D.sectors[k], c=s.cn.index_cagr, u=s.us.index_cagr;
    let tag='<span class="winner w-tie">Level</span>';
    if(c!=null&&u!=null){
      const gap=(c-u)*100;
      if(gap>1.5){tag='<span class="winner w-cn">China ahead</span>';wins.cn++;}
      else if(gap<-1.5){tag='<span class="winner w-us">US ahead</span>';wins.us++;}
    }
    return `<a class="board-row" href="#${k}">
        <div class="sec">${esc(s.label)}</div>
        <div class="pct cn">${pct(c)}</div>
        <div class="pct us">${pct(u)}</div>
        <div>${tag}</div></a>`;
  }).join('');

  document.getElementById('board').innerHTML =
    `<div class="board-head"><div>Sector</div><div>China</div><div>United States</div>
     <div>Ten-year winner</div></div>` + rows;

  document.getElementById('takeaway').innerHTML = `<div class="takeaway">
      <h3>The short version</h3>
      <p>US baskets out-grew Chinese ones in <b>${wins.us} of ${order.length}</b> sectors,
      and the gap is widest exactly where it is most talked about — semiconductors and AI.
      China's one clear win is fintech. Automotive is a genuine dead heat, which is itself
      remarkable given the US set is anchored by Tesla.</p>
      <p style="margin-top:12px">The size gap is larger than the growth gap. Across all five
      sectors the US companies here are worth roughly
      <b>${(() => {
        let c=0,u=0; order.forEach(k=>{c+=D.sectors[k].cn.aggregate.market_cap_usd||0;
                                       u+=D.sectors[k].us.aggregate.market_cap_usd||0;});
        return (u/c).toFixed(0);
      })()}×</b> their Chinese counterparts by market value — so this is not a story of a
      challenger catching up, at least not in the listed markets an outside investor can reach.</p>
    </div>`;

  /* ---------- chart ---------- */
  function lineChart(cn, us){
    const W=1000,H=380,L=62,R=18,T=16,B=34;
    const all=[...cn,...us]; if(!all.length) return '';
    const ts=d=>Date.parse(d+'T00:00:00Z');
    const x0=Math.min(...all.map(p=>ts(p.d))), x1=Math.max(...all.map(p=>ts(p.d)));
    const vmax=Math.max(...all.map(p=>p.v))*1.06, vmin=0;
    const X=d=>L+(ts(d)-x0)/(x1-x0)*(W-L-R);
    const Y=v=>T+(1-(v-vmin)/(vmax-vmin))*(H-T-B);
    let g='';
    for(let i=0;i<=4;i++){
      const v=vmin+(vmax-vmin)*i/4, y=Y(v);
      g+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"
           stroke="#e3e9ef"/><text x="${L-10}" y="${(y+5).toFixed(1)}" fill="#93a3b3"
           font-size="13" text-anchor="end">${Math.round(v)}</text>`;
    }
    let last=null;
    all.forEach(p=>{const y=p.d.slice(0,4);
      if(y!==last&&+y%2===0){last=y;
        g+=`<text x="${X(p.d).toFixed(1)}" y="${H-10}" fill="#93a3b3" font-size="13"
             text-anchor="middle">${y}</text>`;}
      if(y!==last) last=y;});
    const path=(pts,col)=>pts.length?`<path d="${pts.map((p,i)=>(i?'L':'M')+
      X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${col}"
      stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`:'';
    g+=`<line x1="${L}" x2="${W-R}" y1="${Y(100).toFixed(1)}" y2="${Y(100).toFixed(1)}"
         stroke="#c3ccd5" stroke-dasharray="3 3"/>`;
    g+=path(cn,'#c8342b')+path(us,'#1f5fa9');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
  }

  /* ---------- company table ---------- */
  function table(side, rows){
    const cls = side==='cn'?'cn':'us';
    const title = side==='cn'?'Chinese companies':'US companies';
    const body = rows.map(r=>{
      const growth = r.price_cagr;
      const gcls = growth==null?'':(growth>=0?'pos':'neg');
      const young = r.price_years < 9.5
        ? `<span class="young">listed ${r.listed_from} · ${r.price_years}y only</span>` : '';
      const rc = r.revenue_cagr;
      return `<tr>
        <td class="name">${esc(r.label)}${young}</td>
        <td>${money(r.market_cap_usd)}</td>
        <td>${money(r.revenue_usd)}</td>
        <td class="${gcls}">${pctS(growth)}</td>
        <td class="${rc==null?'':(rc>=0?'pos':'neg')}">${pctS(rc)}${
            r.revenue_cagr_years?`<span class="young">${r.revenue_cagr_years}y</span>`:''}</td>
        <td>${pct(r.profit_margin)}</td>
        <td>${pct(r.capex_intensity)}</td>
        <td>${num(r.pe)}</td></tr>`;
    }).join('');
    return `<div class="tbl-wrap"><div class="tbl-title ${cls}">${title}</div>
      <table><tr>
        <th>Company</th><th>Market cap</th><th>Revenue</th><th>Share price<br>growth p.a.</th>
        <th>Revenue<br>growth p.a.</th><th>Profit<br>margin</th><th>Capex<br>/ revenue</th><th>P/E</th>
      </tr>${body}</table></div>`;
  }

  /* ---------- sections ---------- */
  document.getElementById('sectors').innerHTML = order.map(k=>{
    const s=D.sectors[k], cn=s.cn, us=s.us;
    const stat=(label,cv,uv,fn)=>`<div class="stat"><div class="k">${label}</div>
      <div class="pair"><span class="v cn">${fn(cv)}</span><span class="v us">${fn(uv)}</span></div></div>`;

    return `<section class="sector" id="${k}">
      <h2>${esc(s.label)}</h2>
      <p class="sector-blurb">${esc(s.blurb)}</p>

      <div class="versus">
        <div class="vcard cn"><div class="who">China</div>
          <div class="big">${pct(cn.index_cagr)}</div>
          <div class="cap">per year over ${cn.index_years} years ·
            ${pctS(cn.index_total_return)} total</div></div>
        <div class="vcard us"><div class="who">United States</div>
          <div class="big">${pct(us.index_cagr)}</div>
          <div class="cap">per year over ${us.index_years} years ·
            ${pctS(us.index_total_return)} total</div></div>
      </div>

      <div class="chartbox">
        <div class="legend">
          <span style="color:#c8342b"><i style="background:#c8342b"></i>China</span>
          <span style="color:#1f5fa9"><i style="background:#1f5fa9"></i>United States</span>
        </div>
        ${lineChart(cn.index, us.index)}
        <div class="cap-note">Equal-weight basket, both rebased to 100 at the start of the
          window. A value of 400 means the basket quadrupled.</div>
      </div>

      <div class="stats">
        ${stat('Combined market cap', cn.aggregate.market_cap_usd, us.aggregate.market_cap_usd, money)}
        ${stat('Combined revenue', cn.aggregate.revenue_usd, us.aggregate.revenue_usd, money)}
        ${stat('Capex / revenue', cn.aggregate.capex_intensity, us.aggregate.capex_intensity, pct)}
        ${stat('Median profit margin', cn.aggregate.median_profit_margin, us.aggregate.median_profit_margin, pct)}
        ${stat('Median P/E', cn.aggregate.median_pe, us.aggregate.median_pe, num)}
        ${stat('Full 10y history', cn.aggregate.n_full_history/cn.aggregate.n,
                us.aggregate.n_full_history/us.aggregate.n, v=>Math.round(v*100)+'%')}
      </div>

      ${s.note?`<div class="note"><b>Worth knowing:</b> ${esc(s.note)}</div>`:''}

      <div class="tables">${table('cn',cn.companies)}${table('us',us.companies)}</div>
    </section>`;
  }).join('');

  document.getElementById('lim').innerHTML =
    D.limitations.map(l=>`<li>${esc(l)}</li>`).join('');

  const fx=D.meta.fx||{};
  document.getElementById('footer').innerHTML =
    `Every figure is converted to US dollars at spot (CNY ${(fx.CNY||0).toFixed(4)}, `+
    `HKD ${(fx.HKD||0).toFixed(4)}, EUR ${(fx.EUR||0).toFixed(4)}). `+
    `Rebuilt automatically each weekday. Not investment advice.`;
})();
</script>
</body>
</html>
